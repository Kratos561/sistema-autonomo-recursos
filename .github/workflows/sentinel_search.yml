name: Sentinel Search Cron

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - name: 🚀 Descargar código de GitHub
      uses: actions/checkout@v4
      
    - name: ⚙️ Preparar Máquina de Alto Rendimiento (Node.js)
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: 📦 Instalar Motores (Dependencies)
      run: npm ci || npm install
      
     - name: 🔥 Ejecutar MEGA Crawler (7GB RAM)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # <--- ¡AÑADE ESTA LÍNEA!
        NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      run: node run_crawler.js

